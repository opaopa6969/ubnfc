name: CI

on:
  push:
    branches: [master]
  pull_request:

# Both jobs run on the repository-scoped self-hosted runner (labels: ubnfc-ci); this
# repository does not use GitHub-hosted runners.
#
# The repository is public and the runner is a persistent machine, so pull requests from
# forks must never run on it. Each job therefore runs only for pushes and for pull requests
# whose head branch lives in this repository; the repository settings additionally require
# approval before any workflow from an outside contributor runs.
#
# External fixtures (unlaxer-parser / tinyexpression, both public) are fetched inside the
# native job at the commits pinned in scripts/external-pins.env (issue #105), under
# $RUNNER_TEMP. The job never reads a developer working tree on the runner's machine, so
# its result depends only on this repository's commit. How to move a pin:
# docs/ci-external-fixtures.md.
#
# The runner shares the machine's ~/.rustup, whose *default* toolchain is changed by other
# work (it was 1.98.1 at the last green run on 2026-10-03 and 1.85.0 from 2026-10-22). Name
# the toolchain explicitly so the default does not leak in: the workspace tests clippy the
# generated crates with -D warnings, so the lint set (and therefore the result) depends on
# the toolchain. `stable` is what the tests were last green on; the version is printed below.
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  wasm32:
    name: wasm32-unknown-unknown build (issue #65 / D-070)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubnfc-ci]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions (rustup, JDK and Maven are preinstalled on the runner)
        run: |
          rustc --version && cargo --version
          rustup target list --installed | grep -q wasm32-unknown-unknown
          java -version 2>&1 | head -1 && mvn -v | head -1

      - name: build ubnfc / ubnfc-rust CLI (host)
        run: cargo build --release --bin ubnfc --bin ubnfc-rust

      # examples/json is not a committed crate: generate it (with its JSON Lines driver
      # bin) the same way benchmarks/scripts/prepare-external.sh does, then link it for
      # wasm32 so we get a real .wasm to size-check.
      - name: generate examples/json driver crate and build it for wasm32
        run: |
          work=$(mktemp -d)
          ./target/release/ubnfc ir --grammar examples/json/json.ubnf --out "$work/json.ir.json"
          ./target/release/ubnfc-rust --ir "$work/json.ir.json" --out "$work/json"
          (cd "$work/json" && cargo build --release --target wasm32-unknown-unknown)
          ls -l "$work/json/target/wasm32-unknown-unknown/release/"*.wasm

      # examples/p4-rust and ubnfc-selfhost embed the generated parser as a library
      # module (no standalone bin needing a host), so --lib is the right build here.
      - name: build examples/p4-rust for wasm32 (--lib)
        run: cargo build --release --target wasm32-unknown-unknown -p ubnfc-p4-rust --lib

      - name: build ubnfc-selfhost for wasm32 (--lib)
        run: cargo build --release --target wasm32-unknown-unknown -p ubnfc-selfhost --lib

  native:
    name: native workspace tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubnfc-ci]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions (rustup, JDK and Maven are preinstalled on the runner)
        run: |
          rustc --version && cargo --version
          rustup target list --installed | grep -q wasm32-unknown-unknown
          java -version 2>&1 | head -1 && mvn -v | head -1

      - name: '帰属レポートの構文と集計を検証（issue #6）'
        run: |
          bash -n benchmarks/attribution/prepare.sh benchmarks/attribution/run.sh
          python3 -m unittest discover -s benchmarks/attribution -p 'test_*.py'

      # Shallow-fetch exactly the pinned commits (git fetch --depth 1 origin <sha>) into
      # $RUNNER_TEMP/external and export UNLAXER_PARSER_DIR / UNLAXER_PARSER_ROOT /
      # TINYEXPRESSION_DIR to the following steps via $GITHUB_ENV.
      - name: fetch pinned external fixtures (scripts/external-pins.env)
        run: scripts/fetch-external-fixtures.sh "$RUNNER_TEMP/external"

      # Tests fall back to the sibling layout ../../../unlaxer-parser and
      # ../../../tinyexpression relative to their crate when the variables are unset, so
      # point the runner's _work/ubnfc/ siblings at the same pinned checkouts too. ln -sfn
      # is idempotent; actions/checkout only cleans $GITHUB_WORKSPACE.
      - name: link sibling checkouts next to the workspace
        run: |
          ln -sfn "$UNLAXER_PARSER_DIR" "$GITHUB_WORKSPACE/../unlaxer-parser"
          ln -sfn "$TINYEXPRESSION_DIR" "$GITHUB_WORKSPACE/../tinyexpression"
          ls -l "$GITHUB_WORKSPACE/.."

      - name: build ubnfc-java jar (needed by Rust<->Java cross-backend tests)
        run: cd ubnfc-java && mvn -q -DskipTests package

      - name: LSP / DAP の生成・opt-in 不変条件・段階 5 golden
        run: mvn -q -Plsp -pl ubnfc-lsp -am test "-Dtest=org.unlaxer.ubnfc.lsp.*Test" -Dsurefire.failIfNoSpecifiedTests=false

      # Fixture-driven tests read UNLAXER_PARSER_DIR / TINYEXPRESSION_DIR (exported by the
      # fetch step) or the sibling links created earlier; both are the pinned checkouts.
      # This job is merge-blocking.
      #
      # Test threads / timeouts (issue #73, docs/harness-driver-protocol.md "CI での方針"):
      # --test-threads is left at cargo's default (one per CPU); the runner is a single
      # self-hosted machine shared with other work, so instead of pinning a thread count the
      # fuzz driver timeouts scale with /proc/loadavg (x1..x4 of the 90 s base) and a
      # driver_timeout is retried (max 2) and then counted as unobserved, never as a failure.
      # If a run still goes red only on driver_timeout, rerun the failed job once.
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast
