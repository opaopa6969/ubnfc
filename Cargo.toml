[workspace]
resolver = "2"
members = ["crates/ubnfc-front", "crates/ubnfc-rust", "crates/ubnfc-selfhost", "crates/ubnfc-harness", "crates/ubnfc-fuzz", "crates/ubnfc-rt-template", "examples/handwritten-target/rust", "examples/p4-rust", "examples/stax/interpreter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P4 生成 parser は debug だと 1 parse に数十秒かかる fixture がある。テストの所要を抑える。
[profile.dev.package.ubnfc-p4-rust]
opt-level = 3
