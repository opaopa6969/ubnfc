[workspace]
resolver = "2"
members = ["crates/ubnfc-front", "crates/ubnfc-rust", "crates/ubnfc-selfhost", "crates/ubnfc-harness", "crates/ubnfc-rt-template", "examples/handwritten-target/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
